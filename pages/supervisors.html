
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشرفو خط الإنتاج - التوالف</title>
  <link rel="stylesheet" href="../CSS/style.css">

  <style>
    .page {
      max-width: 1000px;
      margin: 20px auto;
      padding: 15px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .panel {
      background: var(--card-bg, #fff);
      color: var(--text-color, #222);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px #00000012;
    }

    .form {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: end;
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      font-weight: bold;
    }

    .field input,
    .search-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
      background: #fff;
      color: #222;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #1769aa;
      color: #fff;
    }

    .secondary {
      background: #e5e7eb;
      color: #222;
    }

    .edit {
      background: #fff0c2;
      color: #694800;
      padding: 7px 10px;
    }

    .delete {
      background: #ffe0e0;
      color: #a40000;
      padding: 7px 10px;
    }

    .status-message {
      display: none;
      padding: 11px;
      margin-top: 12px;
      border-radius: 8px;
      line-height: 1.7;
    }

    .status-message.success {
      display: block;
      background: #e1f5e8;
      color: #176536;
    }

    .status-message.error {
      display: block;
      background: #ffe6e6;
      color: #a00000;
    }

    .search-area {
      margin-bottom: 15px;
    }

    .count {
      font-weight: bold;
      margin-bottom: 14px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 430px;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 9px;
      text-align: right;
      border-bottom: 1px solid #e5e5e5;
    }

    th {
      background: #f1f5f9;
      color: #222;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .empty {
      text-align: center;
      padding: 22px;
      color: #777;
    }

    @media (max-width: 600px) {
      .form {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 21px;
      }

      .panel {
        padding: 13px;
      }

      .btn {
        width: 100%;
      }

      .actions .btn {
        width: auto;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="header">
      <h1>🧑‍💼 مشرفو خط الإنتاج</h1>
      <a href="../index.html" class="btn secondary"
         style="text-decoration:none;">
        العودة للرئيسية
      </a>
    </header>

    <section class="panel">
      <h2 id="formTitle">إضافة مشرف جديد</h2>

      <form id="supervisorForm" class="form">
        <div class="field">
          <label for="supervisorName">اسم المشرف</label>
          <input
            id="supervisorName"
            type="text"
            maxlength="100"
            placeholder="اكتب اسم المشرف كاملًا"
            required
          >
        </div>

        <button id="saveButton" class="btn primary" type="submit">
          حفظ المشرف
        </button>

        <button id="cancelButton" class="btn secondary"
                type="button" hidden>
          إلغاء التعديل
        </button>
      </form>

      <div id="formStatus" class="status-message"
           role="status" aria-live="polite"></div>
    </section>

    <section class="panel">
      <h2>قائمة المشرفين</h2>

      <div class="search-area">
        <label for="searchSupervisor"><strong>البحث عن مشرف</strong></label>
        <input
          id="searchSupervisor"
          class="search-input"
          type="search"
          placeholder="اكتب اسم المشرف للبحث..."
        >
      </div>

      <div id="supervisorCount" class="count">
        عدد المشرفين: 0
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>م</th>
              <th>اسم المشرف</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="supervisorsTable">
            <tr>
              <td colspan="3" class="empty">
                جارٍ تحميل المشرفين...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="tableStatus" class="status-message"
           role="status" aria-live="polite"></div>
    </section>

  </main>

  <script src="../JS/database.js"></script>

  <script>
    "use strict";

    const supervisorForm = document.getElementById("supervisorForm");
    const supervisorNameInput = document.getElementById("supervisorName");
    const supervisorsTable = document.getElementById("supervisorsTable");
    const supervisorCount = document.getElementById("supervisorCount");
    const searchSupervisor = document.getElementById("searchSupervisor");
    const formTitle = document.getElementById("formTitle");
    const saveButton = document.getElementById("saveButton");
    const cancelButton = document.getElementById("cancelButton");

    let supervisors = [];
    let editingId = null;
    let busy = false;

    function showStatus(elementId, message, type) {
      const element = document.getElementById(elementId);
      element.textContent = message;
      element.className = "status-message " + type;
    }

    function clearStatus(elementId) {
      const element = document.getElementById(elementId);
      element.textContent = "";
      element.className = "status-message";
    }

    function normalizeName(name) {
      return String(name || "")
        .trim()
        .replace(/\s+/g, " ")
        .toLocaleLowerCase();
    }

    async function loadSupervisors() {
      try {
        await TawalefDB.initialize();
        supervisors = await TawalefDB.getAll("supervisors");

        supervisors.sort((a, b) =>
          String(a.name || "").localeCompare(
            String(b.name || ""), "ar"
          )
        );

        renderSupervisors();
      } catch (error) {
        console.error(error);
        supervisorsTable.replaceChildren();

        const row = supervisorsTable.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 3;
        cell.className = "empty";
        cell.textContent = "تعذر تحميل قائمة المشرفين.";

        showStatus(
          "tableStatus",
          "حدث خطأ أثناء تحميل البيانات: " + error.message,
          "error"
        );
      }
    }

    function renderSupervisors() {
      const query = normalizeName(searchSupervisor.value);

      const filtered = supervisors.filter(supervisor =>
        normalizeName(supervisor.name).includes(query)
      );

      supervisorCount.textContent =
        "عدد المشرفين: " + supervisors.length +
        " | نتائج البحث: " + filtered.length;

      supervisorsTable.replaceChildren();

      if (filtered.length === 0) {
        const row = supervisorsTable.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 3;
        cell.className = "empty";
        cell.textContent = query
          ? "لا توجد نتائج مطابقة للبحث."
          : "لم تتم إضافة أي مشرف حتى الآن.";
        return;
      }

      filtered.forEach((supervisor, index) => {
        const row = supervisorsTable.insertRow();

        row.insertCell().textContent = String(index + 1);
        row.insertCell().textContent = supervisor.name;

        const actionsCell = row.insertCell();
        const actions = document.createElement("div");
        actions.className = "actions";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "btn edit";
        editButton.textContent = "تعديل";
        editButton.addEventListener("click", () => {
          startEdit(supervisor.id);
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "btn delete";
        deleteButton.textContent = "حذف";
        deleteButton.addEventListener("click", () => {
          deleteSupervisor(supervisor);
        });

        actions.append(editButton, deleteButton);
        actionsCell.appendChild(actions);
      });
    }

    supervisorForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (busy) return;

      const name = supervisorNameInput.value
        .trim()
        .replace(/\s+/g, " ");

      if (!name) {
        showStatus("formStatus", "يرجى إدخال اسم المشرف.", "error");
        return;
      }

      const duplicate = supervisors.some(supervisor =>
        normalizeName(supervisor.name) === normalizeName(name) &&
        supervisor.id !== editingId
      );

      if (duplicate) {
        showStatus("formStatus", "هذا المشرف مسجل مسبقًا.", "error");
        return;
      }

      busy = true;
      saveButton.disabled = true;

      try {
        await TawalefDB.initialize();

        if (editingId === null) {
          await TawalefDB.add("supervisors", {
            name: name,
            createdAt: new Date().toISOString()
          });

          showStatus(
            "formStatus",
            "تمت إضافة المشرف بنجاح.",
            "success"
          );
        } else {
          const existing = await TawalefDB.getById(
            "supervisors",
            editingId
          );

          if (!existing) {
            throw new Error("لم يتم العثور على المشرف المطلوب تعديله.");
          }

          await TawalefDB.update("supervisors", {
            ...existing,
            name: name,
            updatedAt: new Date().toISOString()
          });

          showStatus(
            "formStatus",
            "تم تعديل بيانات المشرف بنجاح.",
            "success"
          );
        }

        resetForm();
        await loadSupervisors();

      } catch (error) {
        console.error(error);
        showStatus(
          "formStatus",
          "تعذر حفظ المشرف: " + error.message,
          "error"
        );
      } finally {
        busy = false;
        saveButton.disabled = false;
      }
    });

    function startEdit(id) {
      const supervisor = supervisors.find(item => item.id === id);
      if (!supervisor) return;

      editingId = id;
      supervisorNameInput.value = supervisor.name;
      formTitle.textContent = "تعديل بيانات المشرف";
      saveButton.textContent = "حفظ التعديلات";
      cancelButton.hidden = false;
      clearStatus("formStatus");

      supervisorForm.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      supervisorNameInput.focus();
    }

    function resetForm() {
      editingId = null;
      supervisorForm.reset();
      formTitle.textContent = "إضافة مشرف جديد";
      saveButton.textContent = "حفظ المشرف";
      cancelButton.hidden = true;
    }

    cancelButton.addEventListener("click", function() {
      resetForm();
      clearStatus("formStatus");
    });

    async function deleteSupervisor(supervisor) {
      if (busy) return;

      try {
        await TawalefDB.initialize();

        const wastageRecords = await TawalefDB.getAll("wastage");

        const isUsed = wastageRecords.some(record =>
          record.supervisorId === supervisor.id
        );

        if (isUsed) {
          showStatus(
            "tableStatus",
            "لا يمكن حذف هذا المشرف لأنه مرتبط بسجلات توالف. " +
            "حافظ على السجلات التاريخية كما هي.",
            "error"
          );
          return;
        }

        const confirmed = confirm(
          'هل تريد حذف المشرف "' + supervisor.name + '"؟'
        );

        if (!confirmed) return;

        busy = true;
        await TawalefDB.remove("supervisors", supervisor.id);

        if (editingId === supervisor.id) {
          resetForm();
          clearStatus("formStatus");
        }

        showStatus("tableStatus", "تم حذف المشرف بنجاح.", "success");
        await loadSupervisors();

      } catch (error) {
        console.error(error);
        showStatus(
          "tableStatus",
          "تعذر حذف المشرف: " + error.message,
          "error"
        );
      } finally {
        busy = false;
      }
    }

    searchSupervisor.addEventListener("input", renderSupervisors);

    loadSupervisors();
  </script>
</body>
</html>
